name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release: a source archive, its SHA-256 checksum, and notes
# listing the features, fixes and performance changes since the previous tag, from the commit subjects.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the history and tags, for the notes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover tests
      - name: Build the archive and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          if [ "$(cat VERSION)" != "$version" ]; then
            echo "VERSION says $(cat VERSION), but the tag is $TAG" >&2
            exit 1
          fi
          name=linemon-$version
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "$TAG"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          for kind in feat:Features fix:Fixes perf:Performance; do
            lines=$(git log --reverse --format='- %s (%h)' "${previous:+$previous..}$TAG" | grep -E "^- ${kind%%:*}(\(|!|:)" || true)
            [ -n "$lines" ] && printf '### %s\n%s\n\n' "${kind#*:}" "$lines"
          done > notes.md
          gh release create "$TAG" "$name.tar.gz" "$name.tar.gz.sha256" --title "linemon $version" --notes-file notes.md --verify-tag
